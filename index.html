<title>Masa a pesar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f7fc4">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Masa a pesar">

<style>
  :root{
    --pill-red-1:#c33a2a;
    --pill-red-2:#8f2318;
    --pill-blue-1:#2f74b3;
    --pill-blue-2:#1d4d83;
    --pill-edge:#390d08;
    --field-bg:rgba(255,255,255,.94);
    --ink:#2a1a17;
    --scene-fallback:#bfe0f5;
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2vmin;
    background:#cfe6f6;
    background:
      radial-gradient(120% 120% at 30% 10%, #e4f2fb 0%, #bcdcf1 55%, #9cc7e8 100%);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---- Escena que se achica manteniendo proporción ---- */
  .scene{
    --u:min(94vw, calc(92vh * 1.044), 720px);
    position:relative;
    width:var(--u);
    height:calc(var(--u) / 1.044);
    font-size:calc(var(--u) * 0.037);
    background:
      linear-gradient(rgba(255,255,255,.30), rgba(255,255,255,.30)),
      url("assets/fondo.jpg") center/cover no-repeat,
      var(--scene-fallback);
    border-radius:calc(var(--u) * 0.03);
    box-shadow:0 1.2vmin 4vmin -1vmin rgba(24,60,90,.45);
    overflow:hidden;
    isolation:isolate;
  }

  .eq{
    position:absolute;
    height:auto;
    z-index:1;
    pointer-events:none;
    -webkit-user-select:none;user-select:none;
    filter:drop-shadow(0 0.15em 0.3em rgba(20,50,80,.25));
  }
  /* Los tres comparten caja (mismo top y ancho) => arrancan y terminan a la
     misma altura. Cada uno centrado sobre su píldora inferior. */
  .eq-frasco{ left:5%;  top:28%;   width:23%; }
  .eq-mid   { left:39%; top:28.5%; width:23%; }  /* matraz, sobre la columna "Volumen" */
  .eq-right { left:72%; top:29%;   width:23%; }  /* balanza, sobre la columna de masa */

  /* ---- Píldoras ---- */
  .pill{
    position:absolute;
    z-index:2;
    display:flex;
    align-items:center;
    gap:.35em;
    padding:.34em .42em;
    border-radius:999px;
    border:0.09em solid var(--pill-edge);
    background:linear-gradient(180deg,var(--pill-red-1),var(--pill-red-2));
    box-shadow:0 .18em .5em rgba(0,0,0,.28), inset 0 .06em 0 rgba(255,255,255,.28);
    color:#fff;
  }
  .pill-label{
    flex:none;
    font-family:"Fredoka","Trebuchet MS",sans-serif;
    font-weight:600;
    font-size:.6em;
    line-height:1.1;
    padding-left:.35em;
    white-space:nowrap;
    text-shadow:0 .06em .08em rgba(0,0,0,.4);
  }
  .pill-input{
    flex:1 1 auto;
    min-width:3.3em;
    width:100%;
    border:0;
    border-radius:999px;
    background:var(--field-bg);
    color:var(--ink);
    font:inherit;
    font-size:.62em;
    font-weight:600;
    text-align:center;
    padding:.32em .4em;
    font-variant-numeric:tabular-nums;
  }
  .pill-input:focus{ outline:.14em solid #ffd27a; outline-offset:.05em; }
  .pill-input::placeholder{ color:#b6a29d; font-weight:500; }

  .pill-unit{
    flex:none;
    appearance:none;-webkit-appearance:none;
    border:0;
    border-radius:999px;
    background:rgba(255,255,255,.18);
    color:#fff;
    font-family:"Fredoka","Trebuchet MS",sans-serif;
    font-weight:600;
    font-size:.55em;
    padding:.3em 1.35em .3em .5em;
    cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7' fill='none' stroke='white' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'><path d='M1 1.3 5 5.3 9 1.3'/></svg>");
    background-repeat:no-repeat;
    background-position:right .5em center;
  }
  .pill-unit option{ color:var(--ink); }
  /* unidad fija (no desplegable): sin flecha */
  span.pill-unit{ background-image:none; padding-left:.6em; padding-right:.6em; }

  .pill-value{
    flex:1 1 auto;
    text-align:center;
    background:var(--field-bg);
    color:#123a5e;
    font-weight:700;
    border-radius:999px;
    padding:.32em .5em;
    font-size:.62em;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* Posiciones fijas */
  #pill-compuesto{ left:2%;   top:14%;   width:43%; }
  #pill-conc{      left:54%;  top:14%;   width:44%; }

  /* Fila 1: PM | Volumen final (dato) | Pesar (resultado, azul) */
  #pill-pm{        left:1.5%; top:70%;   width:30%; }
  #pill-volfinal{  left:35%;  top:70%;   width:31%; }
  #pill-pesar{     left:70%;  top:70%;   width:28%; }
  /* Fila 2: Pureza | Volumen (resultado, azul) | Pesado (dato) */
  #pill-pureza{    left:1.5%; top:81.5%; width:30%; }
  #pill-vol2{      left:35%;  top:81.5%; width:31%; }
  #pill-pesado{    left:70%;  top:81.5%; width:28%; }

  .pill.is-result{
    background:linear-gradient(180deg,var(--pill-blue-1),var(--pill-blue-2));
    cursor:pointer;
  }
  .pill.is-result .pill-label{ }
  .pill.is-result:focus-visible{ outline:.16em solid #ffd27a; outline-offset:.1em; }

  /* Título = menú de sección (por ahora solo "Soluciones"; después "Diluciones").
     Mismo tamaño que las píldoras de arriba; MAYÚSCULA y ~2 pt más grande. */
  #pill-title{
    position:absolute;
    z-index:2;
    left:28%; top:2.6%; width:44%;
    appearance:none; -webkit-appearance:none;
    border:0.09em solid var(--pill-edge);
    border-radius:999px;
    color:#fff;
    font-family:"Fredoka","Trebuchet MS",sans-serif;
    font-weight:700;
    font-size:.68em;
    text-transform:uppercase;
    letter-spacing:.02em;
    text-align:center;
    text-align-last:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    padding:.5em 1.7em;
    cursor:pointer;
    text-shadow:0 .06em .08em rgba(0,0,0,.4);
    box-shadow:0 .18em .5em rgba(0,0,0,.28), inset 0 .06em 0 rgba(255,255,255,.28);
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M1 1.5 6 6.5 11 1.5'/></svg>") no-repeat right 1em center,
      linear-gradient(180deg,#c33a2a,#7f1d13);
  }
  #pill-title option{ text-transform:uppercase; color:var(--ink); font-weight:600; }
  #pill-title:focus-visible{ outline:.16em solid #ffd27a; outline-offset:.12em; }

  .pill.shake{ animation:shake .35s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0) }
    25%{ transform:translateX(-0.25em) }
    75%{ transform:translateX(0.25em) }
  }

  /* ---- Pizarra (detalle del cálculo) ---- */
  #board{
    position:fixed;
    inset:0;
    z-index:50;
    display:grid;
    place-items:center;
    padding:4vmin;
    background:rgba(196,222,241,.5);
    -webkit-backdrop-filter:blur(11px) saturate(1.05);
    backdrop-filter:blur(11px) saturate(1.05);
  }
  #board-canvas{
    width:auto;
    height:auto;
    max-width:min(94vw, 980px);
    max-height:84vh;
    cursor:copy;
    filter:drop-shadow(0 2vmin 5vmin rgba(20,50,80,.4));
    border-radius:1vmin;
  }
  #board-hint{
    position:fixed;
    left:0; right:0; bottom:2.5vmin;
    text-align:center;
    font-family:"Fredoka",sans-serif;
    font-weight:500;
    font-size:clamp(11px,2.4vmin,15px);
    color:#1c3f5e;
    pointer-events:none;
    text-shadow:0 1px 2px rgba(255,255,255,.6);
  }

  #toast{
    position:fixed;
    left:50%; bottom:9vmin;
    transform:translateX(-50%) translateY(1em);
    background:#173a57;
    color:#fff;
    font-family:"Fredoka",sans-serif;
    font-weight:500;
    font-size:clamp(12px,2.4vmin,15px);
    padding:.6em 1.1em;
    border-radius:999px;
    box-shadow:0 .6vmin 2vmin rgba(0,0,0,.3);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:60;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none!important; transition:none!important; }
  }
</style>

<div class="scene" id="scene">
  <img class="eq eq-frasco" src="assets/frasco.png" alt="" aria-hidden="true">
  <img class="eq eq-mid" src="assets/matraz.png" alt="" aria-hidden="true">
  <img class="eq eq-right" src="assets/balanza.png" alt="" aria-hidden="true">

  <select id="pill-title" aria-label="Elegí la sección">
    <option value="soluciones" selected>Soluciones</option>
  </select>

  <div class="pill" id="pill-compuesto">
    <label class="pill-label" for="compuesto">Compuesto</label>
    <input class="pill-input" id="compuesto" type="text" maxlength="40" autocomplete="off" placeholder="opcional">
  </div>

  <div class="pill" id="pill-conc">
    <label class="pill-label" for="conc">Concentración</label>
    <input class="pill-input" id="conc" inputmode="decimal" autocomplete="off" placeholder="—">
    <select class="pill-unit" id="conc-unit" aria-label="Unidad de concentración">
      <option value="M">M</option>
      <option value="mM" selected>mM</option>
      <option value="uM">µM</option>
      <option value="ppm">ppm</option>
    </select>
  </div>

  <div class="pill" id="pill-pm">
    <label class="pill-label" for="pm">PM</label>
    <input class="pill-input" id="pm" inputmode="decimal" autocomplete="off" placeholder="—">
    <select class="pill-unit" id="pm-unit" aria-label="Unidad de peso molecular">
      <option value="g/mol" selected>g/mol</option>
      <option value="kg/mol">kg/mol</option>
    </select>
  </div>

  <div class="pill" id="pill-pureza">
    <label class="pill-label" for="pureza">Pureza</label>
    <input class="pill-input" id="pureza" inputmode="decimal" autocomplete="off" placeholder="100">
    <span class="pill-unit" style="pointer-events:none">%</span>
  </div>

  <!-- Fila 1: querés preparar tanto volumen -> cuánto pesar -->
  <div class="pill" id="pill-volfinal">
    <label class="pill-label" for="volfinal">Volumen</label>
    <input class="pill-input" id="volfinal" inputmode="decimal" autocomplete="off" placeholder="—">
    <select class="pill-unit" id="volfinal-unit" aria-label="Unidad del volumen a preparar">
      <option value="uL">µL</option>
      <option value="mL" selected>mL</option>
      <option value="L">L</option>
    </select>
  </div>

  <div class="pill is-result" id="pill-pesar" role="button" tabindex="0" aria-label="Masa a pesar (tocá para ver el cálculo)">
    <span class="pill-label">Pesar</span>
    <span class="pill-value" id="pesar-out">—</span>
  </div>

  <!-- Fila 2: pesaste realmente esto -> a qué volumen llevarlo -->
  <div class="pill is-result" id="pill-vol2" role="button" tabindex="0" aria-label="Volumen a usar (tocá para ver el cálculo)">
    <span class="pill-label">Volumen</span>
    <span class="pill-value" id="vol2-out">—</span>
  </div>

  <div class="pill" id="pill-pesado">
    <label class="pill-label" for="pesado">Pesado</label>
    <input class="pill-input" id="pesado" inputmode="decimal" autocomplete="off" placeholder="—">
    <select class="pill-unit" id="pesado-unit" aria-label="Unidad de lo que pesaste">
      <option value="ug">µg</option>
      <option value="mg" selected>mg</option>
      <option value="g">g</option>
    </select>
  </div>
</div>

<div id="board" hidden>
  <canvas id="board-canvas"></canvas>
  <div id="board-hint">Tocá la pizarra para copiarla como imagen · tocá afuera para volver</div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  var pmEl = $("pm"), pmUnitEl = $("pm-unit");
  var purEl = $("pureza");
  var concEl = $("conc"), concUnitEl = $("conc-unit");
  var compuestoEl = $("compuesto");
  var volfinalEl = $("volfinal"), volfinalUnitEl = $("volfinal-unit");
  var pesadoEl = $("pesado"), pesadoUnitEl = $("pesado-unit");
  var pesarOut = $("pesar-out"), vol2Out = $("vol2-out");
  var pillPesar = $("pill-pesar"), pillVol2 = $("pill-vol2");
  var titleSel = $("pill-title");

  var VOL_TO_L  = { L: 1, mL: 1e-3, uL: 1e-6 };
  var CONC_TO_M = { M: 1, mM: 1e-3, uM: 1e-6 };
  var MASS_TO_G = { g: 1, mg: 1e-3, ug: 1e-6 };
  var PM_TO_GMOL = { "g/mol": 1, "kg/mol": 1000 };
  var LBL = { M: "M", mM: "mM", uM: "µM", ppm: "ppm", L: "L", mL: "mL", uL: "µL", g: "g", mg: "mg", ug: "µg" };

  var lastPesar = { ok: false };     // fila 1: volumen a preparar -> masa a pesar
  var lastVol2  = { ok: false };     // fila 2: masa realmente pesada -> volumen a usar

  function num(el) {
    if (!el.value) return NaN;
    return parseFloat(el.value.replace(",", ".").trim());
  }
  function fmt(n, p) {
    if (n === 0) return "0";
    if (!isFinite(n)) return "—";
    var abs = Math.abs(n);
    if (abs < 1e-4 || abs >= 1e7) return n.toExponential(Math.max(0, (p || 4) - 1));
    return Number(n.toPrecision(p || 4)).toLocaleString("es-ES", { maximumFractionDigits: 12 });
  }
  function scaleMass(g) {
    var a = Math.abs(g);
    if (a >= 1) return { val: g, unit: "g" };
    if (a >= 1e-3) return { val: g * 1e3, unit: "mg" };
    if (a >= 1e-6) return { val: g * 1e6, unit: "µg" };
    return { val: g * 1e9, unit: "ng" };
  }
  function scaleVol(l) {
    var a = Math.abs(l);
    if (a >= 1) return { val: l, unit: "L" };
    if (a >= 1e-3) return { val: l * 1e3, unit: "mL" };
    return { val: l * 1e6, unit: "µL" };
  }

  // Datos compartidos por las dos filas (PM, concentración, pureza, compuesto).
  // Devuelve null si falta algo esencial, {bad:"..."} si un valor está fuera de rango.
  function sharedCtx() {
    var pmRaw = num(pmEl);
    var pm = isNaN(pmRaw) ? NaN : pmRaw * PM_TO_GMOL[pmUnitEl.value];
    var c = num(concEl);
    var concUnit = concUnitEl.value;
    var isPpm = concUnit === "ppm";
    var needPm = !isPpm;

    if (isNaN(c) || (needPm && isNaN(pm))) return null;
    if (c <= 0 || (needPm && pm <= 0)) return null;

    var pur = num(purEl);
    var purityFrac = 1;
    if (!isNaN(pur)) {
      if (pur <= 0 || pur > 100) return { bad: "pureza 0–100" };
      purityFrac = pur / 100;
    }

    var molL = isPpm ? null : c * CONC_TO_M[concUnit];
    var compuesto = compuestoEl.value.trim();
    var titulo = fmt(c) + " " + LBL[concUnit];
    if (compuesto) titulo = compuesto + " " + titulo;

    return {
      pm: pm, c: c, concUnit: concUnit, isPpm: isPpm,
      pur: pur, purityFrac: purityFrac, corrige: purityFrac < 1,
      molL: molL, titulo: titulo
    };
  }

  function baseLines(s) {
    var lines = [];
    if (!s.isPpm && s.concUnit !== "M") {
      lines.push("C = " + fmt(s.c) + " " + LBL[s.concUnit] + " = " + fmt(s.molL, 6) + " mol/L");
    }
    return lines;
  }

  // Fila 1: querés preparar V de solución  ->  cuánto pesar
  function calcPesar(s) {
    var v = num(volfinalEl);
    if (isNaN(v) || v <= 0) return null;
    var vL = v * (VOL_TO_L[volfinalUnitEl.value] || 1e-3);
    var lines = baseLines(s);
    var mLbl = s.corrige ? "m(puro)" : "m";
    var gramsPure, nMmol = null;
    if (s.isPpm) {
      gramsPure = s.c * vL / 1000;
      lines.push(mLbl + " = C · V = " + fmt(s.c) + " mg/L · " + fmt(vL) + " L = " + fmt(s.c * vL) + " mg");
      if (!isNaN(s.pm) && s.pm > 0) lines.push("≈ " + fmt(s.c / s.pm) + " mM  (con PM = " + fmt(s.pm) + " g/mol)");
    } else {
      gramsPure = s.pm * s.molL * vL;
      nMmol = s.molL * vL * 1000;
      lines.push(mLbl + " = PM · C · V = " + fmt(s.pm) + " g/mol · " + fmt(s.molL, 6) + " mol/L · " + fmt(vL) + " L = " + fmt(gramsPure) + " g");
    }
    var grams = gramsPure / s.purityFrac;
    if (s.corrige) lines.push("Pureza " + fmt(s.pur) + " % → m = " + fmt(gramsPure) + " g / " + fmt(s.purityFrac) + " = " + fmt(grams) + " g");
    if (nMmol !== null) lines.push("Cantidad de sustancia: n = " + fmt(nMmol) + " mmol");
    var scaled = scaleMass(grams);
    if (scaled.unit !== "g") lines.unshift("= " + fmt(grams) + " g");
    return {
      ok: true, title: s.titulo,
      out: fmt(scaled.val) + " " + scaled.unit,
      headline: "Para " + fmt(v) + " " + LBL[volfinalUnitEl.value] + "  →  " + fmt(scaled.val) + " " + scaled.unit,
      lines: lines
    };
  }

  // Fila 2: pesaste realmente M  ->  a qué volumen llevarlo
  function calcVol2(s) {
    var m = num(pesadoEl);
    if (isNaN(m) || m <= 0) return null;
    var massG = m * MASS_TO_G[pesadoUnitEl.value];
    var massPure = massG * s.purityFrac;
    var lines = baseLines(s);
    var mLbl = s.corrige ? "m(puro)" : "m";
    if (s.corrige) lines.push("Pureza " + fmt(s.pur) + " % → m(puro) = " + fmt(massG) + " g · " + fmt(s.purityFrac) + " = " + fmt(massPure) + " g");
    var vL2;
    if (s.isPpm) {
      vL2 = massPure * 1000 / s.c;
      lines.push("V = " + mLbl + " / C = " + fmt(massPure * 1000) + " mg / " + fmt(s.c) + " mg/L = " + fmt(vL2) + " L");
    } else {
      vL2 = massPure / (s.pm * s.molL);
      lines.push("V = " + mLbl + " / (PM · C) = " + fmt(massPure) + " g / (" + fmt(s.pm) + " g/mol · " + fmt(s.molL, 6) + " mol/L) = " + fmt(vL2) + " L");
      lines.push("Cantidad de sustancia: n = " + fmt(massPure / s.pm * 1000) + " mmol");
    }
    var scaled = scaleVol(vL2);
    if (scaled.unit !== "L") lines.unshift("= " + fmt(vL2) + " L");
    return {
      ok: true, title: s.titulo,
      out: fmt(scaled.val) + " " + scaled.unit,
      headline: "Para " + fmt(m) + " " + LBL[pesadoUnitEl.value] + "  →  " + fmt(scaled.val) + " " + scaled.unit,
      lines: lines
    };
  }

  function calc() {
    var s = sharedCtx();
    var badMsg = s && s.bad ? s.bad : "—";
    var ready = s && !s.bad;

    var r1 = ready ? calcPesar(s) : null;
    lastPesar = r1 || { ok: false };
    pesarOut.textContent = r1 ? r1.out : badMsg;

    var r2 = ready ? calcVol2(s) : null;
    lastVol2 = r2 || { ok: false };
    vol2Out.textContent = r2 ? r2.out : badMsg;
  }

  /* ---------------- Pizarra ---------------- */
  var board = $("board"), canvas = $("board-canvas"), toastEl = $("toast");
  var boardImg = new Image();
  boardImg.src = "assets/pizarron.png";
  var toastTimer;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2200);
  }

  function wrap(ctx, text, x, y, maxW, lh) {
    var words = text.split(" "), line = "";
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + " " + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line, x, y); y += lh; line = words[i];
      } else {
        line = test;
      }
    }
    if (line) { ctx.fillText(line, x, y); y += lh; }
    return y;
  }

  function paintBoard(data) {
    var W = 1600;
    var ratio = (boardImg.naturalHeight && boardImg.naturalWidth)
      ? boardImg.naturalHeight / boardImg.naturalWidth : 0.563;
    var H = Math.round(W * ratio);
    canvas.width = W; canvas.height = H;
    var ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, W, H);   // fuera del marco queda transparente (se copia sin fondo)
    if (boardImg.complete && boardImg.naturalWidth) ctx.drawImage(boardImg, 0, 0, W, H);

    var padX = W * 0.075, x = padX, y = H * 0.135;
    var maxW = W - padX * 2;
    ctx.textBaseline = "top";

    ctx.fillStyle = "#9c1f1f";
    var tFont = Math.round(H * 0.12);
    ctx.font = '700 ' + tFont + 'px "Caveat", cursive';
    var tW = ctx.measureText(data.title).width;
    if (tW > maxW) {
      tFont = Math.floor(tFont * maxW / tW);
      ctx.font = '700 ' + tFont + 'px "Caveat", cursive';
    }
    ctx.textAlign = "center";
    ctx.fillText(data.title, W / 2, y);
    ctx.textAlign = "left";
    y += H * 0.16;

    ctx.fillStyle = "#33302b";
    ctx.font = '600 ' + Math.round(H * 0.088) + 'px "Caveat", cursive';
    y = wrap(ctx, data.headline, x, y, maxW, H * 0.1);
    y += H * 0.03;

    ctx.font = '500 ' + Math.round(H * 0.058) + 'px "Caveat", cursive';
    for (var i = 0; i < data.lines.length; i++) {
      y = wrap(ctx, data.lines[i], x, y, maxW, H * 0.072);
    }
  }

  function openBoard(data, pill) {
    if (!data || !data.ok) {
      pill.classList.remove("shake"); void pill.offsetWidth; pill.classList.add("shake");
      return;
    }
    Promise.all([
      document.fonts.load('700 80px "Caveat"'),
      document.fonts.load('600 80px "Caveat"'),
      document.fonts.load('500 80px "Caveat"')
    ]).catch(function () {}).then(function () {
      paintBoard(data);
      board.hidden = false;
      document.documentElement.style.overflow = "hidden";
    });
  }
  function closeBoard() {
    board.hidden = true;
    document.documentElement.style.overflow = "";
  }

  canvas.addEventListener("click", function (e) {
    e.stopPropagation();
    canvas.toBlob(function (blob) {
      if (!blob) { toast("No se pudo generar la imagen"); return; }
      if (navigator.clipboard && window.ClipboardItem) {
        navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
          .then(function () { toast("Cálculo copiado ✓  pegalo en tu documento"); })
          .catch(function () { downloadBlob(blob); });
      } else {
        downloadBlob(blob);
      }
    }, "image/png");
  });
  function downloadBlob(blob) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "masa-a-pesar.png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    toast("Imagen guardada");
  }
  board.addEventListener("click", closeBoard);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !board.hidden) closeBoard();
  });

  function wireResult(pill, getData) {
    pill.addEventListener("click", function () { openBoard(getData(), pill); });
    pill.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openBoard(getData(), pill); }
    });
  }
  wireResult(pillPesar, function () { return lastPesar; });
  wireResult(pillVol2,  function () { return lastVol2; });

  // Menú de sección. Por ahora solo "Soluciones"; cuando exista la página de
  // diluciones, agregar <option value="diluciones"> y navegar acá:
  titleSel.addEventListener("change", function () {
    // if (titleSel.value === "diluciones") location.href = "diluciones.html";
  });

  [pmEl, purEl, concEl, compuestoEl, volfinalEl, pesadoEl].forEach(function (el) {
    el.addEventListener("input", calc);
  });
  [pmUnitEl, concUnitEl, volfinalUnitEl, pesadoUnitEl].forEach(function (el) {
    el.addEventListener("change", calc);
  });

  calc();

  /* ---------------- Offline ---------------- */
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
